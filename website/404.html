<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Marbor</title>
<meta name="robots" content="noindex, nofollow">
<script>
  (function () {
    var l = window.location;
    var path = l.pathname;
    if (path === '/marbor/demo') {
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/marbor/demo/');
    } else if (path.indexOf('/marbor/demo/') === 0) {
      var subpath = path.slice(18);
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/marbor/demo/#/' + subpath + l.search + l.hash);
    }
  })();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="site.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .inner { max-width: 420px; }
  .code {
    font-family: var(--display);
    font-size: 88px;
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 1;
    margin: 20px 0 12px;
    color: var(--signal);
  }
  .mark { color: var(--signal); width: 28px; height: 28px; margin: 0 auto; display: block; }
  h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
</style>
</head>
<body>
<div class="inner">
  <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <path d="M7 8v16M7 16l8-8v16M15 16l8-8v16" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
  </svg>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist. It may have moved or been removed.</p>
  <a class="btn btn-primary" href="/marbor/">Back to Marbor</a>
</div>
</body>
</html>
